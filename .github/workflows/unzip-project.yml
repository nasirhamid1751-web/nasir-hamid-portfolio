name: Extract Portfolio ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/portfolio
          unzip -q nasir-hamid-portfolio-github.zip -d /tmp/portfolio

          cp -a /tmp/portfolio/nasir-hamid-portfolio/. .

          rm -f nasir-hamid-portfolio-github.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract portfolio project"
          git push
